note = "2026-09-15 additive inverse-Horn source review checked Appendix 2 Proposition 4, introduction geometric paragraphs, and Sections 5-6 selection scope. The integer-linear map converts hives with one value fixed into honeycombs; rhombus slacks correspond to edge lengths and boundary differences to spectra. The largest-lift selection is combinatorial, not a general matrix reconstruction algorithm. No theorem promotion or multiplicative extension."
