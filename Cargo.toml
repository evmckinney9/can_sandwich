# Depth-two realization solver used by gulps-core.
[package]
name = "can_sandwich"
description = "Depth-two two-qubit realization solver used by gulps-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[features]
default = []
# Profiler counters and the corpus driver. Default builds compile them out.
diagnostics = []
# JSON-lines adapter for the independent public competition runner.
benchmark = ["dep:serde_json"]

[dependencies]
nalgebra = "0.35"
# Companion-matrix eigenvalues for the polynomial root primitives.
faer = { version = "0.24", default-features = false, features = ["std"] }
dyn-stack = "0.13"
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }

[[bin]]
name = "can_sandwich"
path = "benchmark/diagnostics.rs"
required-features = ["diagnostics"]

[[bin]]
name = "can_sandwich_server"
path = "benchmark/production_server.rs"
required-features = ["benchmark"]
