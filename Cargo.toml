# Depth-two realization solver used by gulps-core.
[package]
name = "can_sandwich"
description = "Depth-two two-qubit realization solver used by gulps-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Profiler counters and the corpus driver. Default builds compile them out.
diagnostics = []

[dependencies]
nalgebra = "0.35"
# Companion-matrix eigenvalues for the polynomial root primitives.
faer = { version = "0.24", default-features = false, features = ["std"] }
dyn-stack = "0.13"

[[bin]]
name = "can_sandwich"
path = "src/main.rs"
required-features = ["diagnostics"]
