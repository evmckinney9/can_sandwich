# Depth-two realization solver used by gulps-core.
[package]
name = "can_sandwich"
description = "Depth-two two-qubit realization solver used by gulps-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[features]
default = []
# Internal diagnostic routes and profiler counters.
diagnostics = []

[dependencies]
nalgebra = "0.35"
# Companion-matrix eigenvalues for the polynomial root primitives.
faer = { version = "0.24", default-features = false, features = ["std"] }
dyn-stack = "0.13"
